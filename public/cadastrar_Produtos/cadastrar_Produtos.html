<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="cadastrar_Produtos.css">
</head>
<body>

    <header class="cabecalho">
        <h1 id="nome_Administrador">Bem-vindo(a)</h1>
        
    </header>

    <main class="conteudo-principal">
        <div class="container-cadastro">
            <h2>Cadastro e Atualização de Produtos</h2>

            <!-- Seção de Busca/Seleção do Produto -->
            <section class="secao-pesquisa">
                <label for="pesquisar_produto">Buscar Produto Existente:</label>
                <div class="input-com-seta">
                    <input 
                        type="text" 
                        id="pesquisar_produto" 
                        placeholder="Digite a descrição para buscar..." 
                        autocomplete="off"
                    >
                    <span id="seta_dropdown" class="seta-dropdown">▼</span>
                </div>
                <ul id="dropdown_produtos" class="dropdown-lista"></ul>
            </section>

            <!-- Checkbox para alternar entre Novo Cadastro ou Edição -->
            <div class="opcao-novo-produto">
                <input type="checkbox" id="check_cadastrar_novo">
                <label for="check_cadastrar_novo">Cadastrar como um NOVO produto</label>
            </div>

            <!-- Formulário Principal -->
            <form id="form-produto" onsubmit="return false;">
                <!-- Campo Oculto para armazenar o ID do Produto durante edições -->
                <input type="hidden" id="produto_id" name="produto_id">

                <div class="campo-grupo">
                    <label for="descricao">Descrição do Produto:</label>
                    <input 
                        type="text" 
                        id="descricao" 
                        name="descricao" 
                        placeholder="Nome/Descrição do produto"
                    >
                </div>

                <div class="linha-dupla">
                    <div class="campo-grupo">
                        <label for="qtd_adicionar">Qtd. a Adicionar:</label>
                        <input 
                            type="number" 
                            id="qtd_adicionar" 
                            name="qtd_adicionar" 
                            min="0" 
                            value="0"
                        >
                    </div>

                    <div class="campo-grupo">
                        <label for="qtd_atual">Qtd. Atual em Estoque:</label>
                        <input 
                            type="number" 
                            id="qtd_atual" 
                            name="qtd_atual" 
                            min="0" 
                            value="0"
                        >
                    </div>
                </div>

                <div class="linha-tripla">
                    <div class="campo-grupo">
                        <label for="preco_unitario">Preço Custo (Unitário R$):</label>
                        <input 
                            type="number" 
                            id="preco_unitario" 
                            name="preco_unitario" 
                            step="0.01" 
                            min="0" 
                            placeholder="0.00"
                        >
                    </div>

                    <div class="campo-grupo">
                        <label for="preco_compra">Preço Total de Compra (R$):</label>
                        <input 
                            type="number" 
                            id="preco_compra" 
                            name="preco_compra" 
                            step="0.01" 
                            value="0.00" 
                            readonly 
                            disabled
                        >
                    </div>

                    <div class="campo-grupo">
                        <label for="preco_venda">Preço de Venda (R$):</label>
                        <input 
                            type="number" 
                            id="preco_venda" 
                            name="preco_venda" 
                            step="0.01" 
                            min="0" 
                            placeholder="0.00"
                        >
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="estoque_minimo">Estoque Mínimo (Alerta):</label>
                    <input 
                        type="number" 
                        id="estoque_minimo" 
                        name="estoque_minimo" 
                        min="0" 
                        value="0"
                    >
                </div>

                <div class="acoes-formulario">
                    <button type="button" class="btn-custom btn-back" id="voltar">⬅ Voltar</button>
                    <button type="button" id="btn-adicionar" class="btn-custom btn-add">➕ Adicionar</button>
                    
                </div>
            </form>
        </div>
    </main>

    <script src="cadastrar_Produtos.js"></script>
</body>
</html>
