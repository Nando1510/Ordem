<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    
    <title>Detalhes do Cliente</title>
    <link rel="stylesheet" href="detalhes_Cliente.css" />
</head>
<body>

    <div class="container-detalhes">
        <header class="detalhes-header">
            <h2>SYS // FICHA_CLIENTE_ID: <span id="label-id">...</span></h2>
        </header>
        
        <div class="detalhes-body">
            <form id="form-detalhes" class="form-grid">
                
                <div class="form-group-full">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" id="nome" class="form-control-custom" disabled required />
                </div>

                <div>
                    <label class="form-label">CPF / CNPJ</label>
                    <input type="text" id="cpf_cnpj" class="form-control-custom" disabled required />
                </div>

                <div>
                    <label class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control-custom" disabled />
                </div>

                <div>
                    <label class="form-label">Telefone Fixo</label>
                    <input type="text" id="telefone" class="form-control-custom" disabled />
                </div>

                <div>
                    <label class="form-label">Celular</label>
                    <input type="text" id="celular" class="form-control-custom" disabled required />
                </div>

                <div class="form-group-full">
                    <label class="form-label">Rua</label>
                    <input type="text" id="rua" class="form-control-custom" disabled />
                </div>

                <div>
                    <label class="form-label">Número</label>
                    <input type="text" id="numero" class="form-control-custom" disabled />
                </div>

                <div>
                    <label class="form-label">Bairro</label>
                    <input type="text" id="bairro" class="form-control-custom" disabled />
                </div>

                <div>
                    <label class="form-label">Cidade</label>
                    <input type="text" id="cidade" class="form-control-custom" disabled required />
                </div>

                <div>
                    <label class="form-label">Estado (UF)</label>
                    <select id="estado" class="form-control-custom" disabled>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">CEP</label>
                    <input type="text" id="cep" class="form-control-custom" disabled />
                </div>

            </form>
        </div>

        <footer class="detalhes-footer">
            <button type="button" class="btn-custom btn-back" id="voltar" >⬅ Voltar</button>
            <button type="button" id="btn-acao" class="btn-custom btn-edit">✏️ Editar</button>
        </footer>
    </div>

    <script src="detalhes_Cliente.js"></script>
</body>
</html>
