<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Rocha Solidez Ordens de Serviços 🧰</title>
    <!-- BIBLIOTECAS PARA GERAÇÃO DA NOTA FISCAL EM PDF (jsPDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="usuario-topo">
        <span id="nome_Administrador">Bem-vindo(a), </span>
        <button onclick="voltar_Pagina()" class="btn-sair" id="sair">Sair</button>
    </div>

    <div class="container">
        <h1>Rocha Solidez Ordens de Serviços 🧰</h1>
        
        <div class="card">
            <!-- SELEÇÃO DE PRODUTO COM DATALIST (SETINHA NA PONTA DIREITA) -->
            <div class="lineInput">
                <label for="produto">Produto:</label>
                <input type="text" id="produto" list="lista_produtos_db" placeholder="Selecione ou digite o produto..." autocomplete="off" >
                <datalist id="lista_produtos_db">
                    <!-- Preenchido dinamicamente via JS do banco de dados em ordem alfabética -->
                </datalist>
            </div>

            <!-- VALOR UNITÁRIO (DESABILITADO POR PADRÃO) -->
            <div class="lineInput">
                <label for="preco">Valor unitário (R$):</label>
                <input type="number" id="preco" placeholder="0.00" disabled readonly>
            </div>

            <div class="lineInput" >
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Quantidade" min="1" >
            </div>

            <div class="buttons">
                <button type="button" name="salvar" id="salvar">Salvar no Carrinho</button>
                <button type="button" name="cancelar" id="cancelar">Cancelar</button>
            </div>
        </div>

        <div>
            <table>
                <thead>
                    <tr id="cabecario">
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!-- Itens inseridos dinamicamente -->
                </tbody>
            </table>
        </div>

        <div id="total-compras">Total das compras: R$ 0,00</div>

        <!-- SEÇÃO DE CPF E FINALIZAÇÃO DA VENDA -->
        <div class="card-finalizar">
            <div class="checkbox-container">
                <input type="checkbox" id="chk_cpf">
                <label for="chk_cpf">Deseja colocar CPF na compra?</label>
            </div>

            <div class="lineInput" id="container_cpf" style="display: none;">
                <label for="cpf_cliente">CPF do Cliente:</label>
                <input type="text" id="cpf_cliente" maxlength="11" placeholder="Apenas os 11 números do CPF">
            </div>

            <button type="button" id="btn_finalizar_compra" class="btn-finalizar">🛒 Finalizar Compra</button>
        </div>
    </div>

    <script src="carrinho.js"></script>
</body>
</html>
